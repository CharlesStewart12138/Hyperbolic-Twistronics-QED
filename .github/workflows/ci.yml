name: source-release-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse every Python source
        run: python reproduce.py audit
      - name: Run source-only validation tests
        run: python reproduce.py test validation
      - name: Run R6 source-only tests
        run: python reproduce.py test r6
      - name: Run R7 exact-certificate tests
        run: python reproduce.py test r7
      - name: Exercise reduced R6 operator
        run: python reproduce.py r6-demo
      - name: Replay exact R7 margin certificate
        run: python reproduce.py r7-certificate --output outputs/r7/magic_margin_certificate.json
      - name: Audit release contents
        run: python tools/audit_release.py
