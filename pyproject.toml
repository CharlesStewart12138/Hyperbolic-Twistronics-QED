[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperbolic-bilayer"
version = "0.1.0"
description = "Code-only research release for the hyperbolic bilayer project"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "h5py>=3.10,<4",
  "sympy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "psutil>=5.9,<8",
  "Pillow>=10,<13",
  "mpmath>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["code"]
include = ["production_code*", "validation_code*", "reproducibility*", "r6_physics*", "r7_theory*"]
